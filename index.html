<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1a1a2e">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<title>AMIR · Voxel World 8-Bit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="scene"></canvas>
<div class="scanlines"></div>

<div class="hud">
  <h1 class="title">AMIR</h1>
  <p class="sub">VOXEL WORLD 8-BIT</p>
  <div class="hint">
    <span>drag = orbit</span><span>klik = letak</span><span>kanan = buang</span><span>D = siang/malam</span>
  </div>
</div>

<div class="corner">
  <span id="fps">0 FPS</span>
  <span id="tris">0 TRI</span>
</div>

<div class="buttons">
  <button id="btnDay">SIANG/MALAM</button>
  <button id="btnMode">MODE: LETAK</button>
  <button id="btnWorld">DUNIA BARU</button>
  <button id="btnRotate">AUTO-ROTATE</button>
  <button class="block" id="btnBlock">BLOK: RUMPUT</button>
</div>

<div id="msg" class="msg"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script src="script.js"></script>
</body>
</html>
